<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="section">

<h2>Admin Login</h2>

<form id="loginForm">
<input type="text" id="adminUser" placeholder="Username" required>
<input type="password" id="adminPass" placeholder="Password" required>
<button type="submit" class="glass-btn">Login</button>
</form>

<p id="loginMsg"></p>

<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  if(adminUser.value==="admin" && adminPass.value==="1234"){
    loginMsg.innerText="Login Successful";
    loginMsg.style.color="#22c55e";
  } else {
    loginMsg.innerText="Wrong Credentials";
    loginMsg.style.color="red";
  }
});
</script>

</body>
</html>
