<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADHE RADHE - Sudarshan Indicator</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f172a,#020617);
    color:white;
    text-align:center;
}

header{
    padding:40px 20px;
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#cbd5e1;
    max-width:600px;
    margin:auto;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

section{
    padding:60px 20px;
}

input{
    padding:12px;
    border-radius:8px;
    border:none;
    width:250px;
}

.success{
    color:#22c55e;
    margin-top:15px;
    display:none;
}
</style>
</head>
<body>

<header>
    <h1>RADHE RADHE</h1>
    <div class="hero">
        <p>
            Powered by Sudarshan Smart Money Indicator for TradingView.
            Accurate Buy & Sell signals with trend confirmation.
        </p>
        <button>Get Access Now</button>
    </div>
</header>

<section>
    <h2>Request Indicator Access</h2>
    <p style="color:#cbd5e1;">
        After payment, submit your TradingView username below.
    </p>

    <form id="accessForm">
        <input 
            type="text" 
            id="tvUsername" 
            placeholder="Enter TradingView Username" 
            required
        >
        <br>
        <button type="submit">Submit</button>
    </form>

    <p id="successMsg" class="success">
        Username submitted successfully!
    </p>
</section>

<script>
document.getElementById("accessForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const username = document.getElementById("tvUsername").value;

    const response = await fetch("/api/submit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ username })
    });

    const data = await response.json();

    if(response.ok){
        document.getElementById("successMsg").style.display = "block";
        document.getElementById("accessForm").reset();
    } else {
        alert("Error submitting username");
    }
});
</script>

</body>
</html>
